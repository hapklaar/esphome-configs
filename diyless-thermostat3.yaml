    id: huiskamer_mode
    entity_id: climate.huiskamer
    on_value:
      then:
        - if:
            condition: { lambda: 'return x == "auto";' }
            then:
              - lvgl.arc.update: { id: huiskamer_arc, indicator: { arc_color: 0x4CAF50 } }
              - lvgl.button.update: { id: huiskamer_btn_auto, bg_color: 0x4CAF50 }
              - lvgl.button.update: { id: huiskamer_btn_heat, bg_color: 0x292929 }
              - lvgl.button.update: { id: huiskamer_btn_off, bg_color: 0x292929 }
        - if:
            condition: { lambda: 'return x == "heat";' }
            then:
              - lvgl.arc.update: { id: huiskamer_arc, indicator: { arc_color: 0xFF9800 } }
              - lvgl.button.update: { id: huiskamer_btn_auto, bg_color: 0x292929 }
              - lvgl.button.update: { id: huiskamer_btn_heat, bg_color: 0xFF9800 }
              - lvgl.button.update: { id: huiskamer_btn_off, bg_color: 0x292929 }
