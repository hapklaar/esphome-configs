lvgl:  
  disp_bg_color: black
  text_color: white
  displays: diyless_display
  touchscreens:
    - touchscreen_id: diyless_touchscreen
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - light.turn_on:
          id: backlight
          brightness: 50%
  
  top_layer:
    text_color: white
    widgets:
      - label:
          id: ip_label
          text: "0.0.0.0"
          text_color: 0x808080
          pad_top: 8
          pad_left: 16
      - label:
          id: flame_icon
          align: BOTTOM_RIGHT
          x: -16
          y: -16
          text: "\u25CF"
          text_font: montserrat_32
          text_color: 0x2095F6

  pages:
    # --- PAGE 1: HUISKAMER ---
    - id: huiskamer_page
      bg_opa: TRANSP
      widgets:
        - arc:
            id: huiskamer_arc
            align: CENTER
            y: 20
            adjustable: true
            value: 50
            min_value: 50
            max_value: 300
            width: 420
            height: 420
            arc_width: 24
            arc_color: 0x292929
            indicator:
              arc_color: 0xFF6F22
              arc_width: 24
            knob:
              bg_color: 0xFFFFFF
            on_value:
              then:
                - script.execute:
                    id: set_huiskamer
                    temp: !lambda "return x / 10.0;"
        - label:
            id: huiskamer_action_label
            align: CENTER
            y: -80
            text_font: montserrat_20
            text: "--"
            text_color: 0xFF6F22
        - label:
            id: huiskamer_target_label
            align: CENTER
            text: "--.-°"
            y: 0
            text_font: font_roboto_72
        - label:
            id: huiskamer_current_label
            align: CENTER
            text: "Current: --.-°"
            text_font: montserrat_32
            text_color: 0x808080
            y: 100
        - label:
            align: CENTER
            y: 200
            text: "HUISKAMER"
            text_font: montserrat_32
            text_color: 0xFFFFFF
        - button:
            align: CENTER
            x: -196
            y: -180
            width: 54
            height: 54
            bg_color: 0x000000
            shadow_width: 0
            text_font: montserrat_32
            pressed:
              bg_color: 0xFF6F22
            widgets:
              - label:
                  align: CENTER
                  text: "\uF053"
            on_click:
              then:
                - lvgl.page.show:
                    id: dhw_page
                    animation: MOVE_RIGHT
                    time: 300ms
        - button:
            align: CENTER
            x: 196
            y: -180
            width: 54
            height: 54
            bg_color: 0x000000
            shadow_width: 0
            text_font: montserrat_32
            pressed:
