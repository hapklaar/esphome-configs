              - lvgl.button.update: { id: dhw_btn_heat, bg_color: 0x292929 }
              - lvgl.button.update: { id: dhw_btn_off, bg_color: 0x606060 }

sensor:
  - platform: homeassistant
    id: huiskamer_current_temp
    entity_id: climate.huiskamer
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: huiskamer_current_label
          text: !lambda 'return str_sprintf("%.1f°", x);'
  - platform: homeassistant
    id: huiskamer_target_temp
    entity_id: climate.huiskamer
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: huiskamer_target_label
          text: !lambda 'return str_sprintf("%.1f°", x);'
      - lvgl.arc.update: { id: huiskamer_arc, value: !lambda return x * 10; }

  - platform: homeassistant
    id: keuken_current_temp
    entity_id: climate.keuken
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: keuken_current_label
          text: !lambda 'return str_sprintf("%.1f°", x);'
  - platform: homeassistant
    id: keuken_target_temp
    entity_id: climate.keuken
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: keuken_target_label
          text: !lambda 'return str_sprintf("%.1f°", x);'
      - lvgl.arc.update: { id: keuken_arc, value: !lambda return x * 10; }

  - platform: homeassistant
    id: hal_current_temp
    entity_id: climate.hal
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: hal_current_label
          text: !lambda 'return str_sprintf("%.1f°", x);'
  - platform: homeassistant
    id: hal_target_temp
    entity_id: climate.hal
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: hal_target_label
          text: !lambda 'return str_sprintf("%.1f°", x);'
      - lvgl.arc.update: { id: hal_arc, value: !lambda return x * 10; }

  - platform: homeassistant
    id: slaapkamer_current_temp
    entity_id: climate.slaapkamer
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: slaapkamer_current_label
          text: !lambda 'return str_sprintf("%.1f°", x);'
  - platform: homeassistant
    id: slaapkamer_target_temp
    entity_id: climate.slaapkamer
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: slaapkamer_target_label
          text: !lambda 'return str_sprintf("%.1f°", x);'
      - lvgl.arc.update: { id: slaapkamer_arc, value: !lambda return x * 10; }

  - platform: homeassistant
    id: dhw_target_temp
    entity_id: water_heater.hot_water
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: dhw_target_label
          text: !lambda 'return str_sprintf("%.1f°", x);'
      - lvgl.arc.update: { id: dhw_arc, value: !lambda return x * 10; }

lvgl:  
  disp_bg_color: black
  text_color: white
  displays: diyless_display
  touchscreens:
    - touchscreen_id: diyless_touchscreen
  buffer_size: 20%
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - light.turn_on:
          id: backlight
          brightness: 70%
  
  top_layer:
    text_color: white
    widgets:
      - label:
          id: ip_label
          text: "0.0.0.0"
          text_color: 0x808080
          pad_top: 8
          pad_left: 16
      - label:
          id: flame_icon
          align: BOTTOM_RIGHT
          x: -16
          y: -16
          text: "\uEF55"
          text_font: material_icons_32
          text_color: 0x808080

  pages:
    # --- PAGE 1: HUISKAMER ---
    - id: huiskamer_page
      bg_opa: TRANSP
      widgets:
        - arc:
            id: huiskamer_arc
            align: CENTER
            y: 10
            adjustable: true
            value: 50
            min_value: 50
            max_value: 300
            width: 340
            height: 340
            arc_width: 24
            arc_color: 0x292929
            indicator:
              arc_color: 0x606060
              arc_width: 24
            knob:
              bg_color: 0xFFFFFF
            on_value:
              then:
                - lvgl.label.update:
                    id: huiskamer_target_label
                    text: !lambda 'return str_sprintf("%.1f°", (float)x / 10.0);'
                - if:
                    condition:
                      lambda: 'return ((x / 10.0) < id(huiskamer_target_temp).state - 0.05) || ((x / 10.0) > id(huiskamer_target_temp).state + 0.05);'
                    then:
                      - script.execute:
                          id: set_huiskamer
                          temp: !lambda "return x / 10.0;"
        - label:
            id: huiskamer_action_label
            align: CENTER
            y: -90
            text_font: montserrat_20
            text: "--"
            text_color: 0xFFFFFF
        - label:
            id: huiskamer_target_label
            align: CENTER
            text: "--.-°"
            y: -10
            text_font: font_roboto_72
        - label:
            id: huiskamer_current_label
            align: CENTER
            text: "--.-°"
            text_font: montserrat_32
            text_color: 0x808080
            y: 60
        - label:
            align: CENTER
            y: -210
            text: "HUISKAMER"
            text_font: montserrat_32
            text_color: 0xFFFFFF
        - button:
            align: CENTER
            x: -45
            y: 130
            width: 48
            height: 48
            radius: 24
            bg_color: 0x000000
            border_width: 1
            border_color: 0x2095F6
            widgets:
              - label:
                  align: CENTER
                  text: "\uE15B"
                  text_font: material_icons_32
                  text_color: 0x2095F6
            on_click:
              then:
                - homeassistant.action:
                    action: climate.set_temperature
                    data: { entity_id: climate.huiskamer }
                    data_template: { temperature: "{{ (state_attr('climate.huiskamer', 'temperature') | float) - 0.5 }}" }
        - button:
            align: CENTER
            x: 45
            y: 130
            width: 48
            height: 48
            radius: 24
            bg_color: 0x000000
            border_width: 1
            border_color: 0x2095F6
            widgets:
              - label:
                  align: CENTER
                  text: "\uE145"
                  text_font: material_icons_32
                  text_color: 0x2095F6
            on_click:
              then:
                - homeassistant.action:
                    action: climate.set_temperature
                    data: { entity_id: climate.huiskamer }
                    data_template: { temperature: "{{ (state_attr('climate.huiskamer', 'temperature') | float) + 0.5 }}" }
        - button:
            id: huiskamer_btn_auto
            align: CENTER
            x: -120
            y: 200
            width: 100
            height: 50
            bg_color: 0x292929
            widgets:
              - label:
                  align: CENTER
                  text: "\uE3FA"
                  text_font: material_icons_32
            on_click:
              then:
                - homeassistant.action:
                    action: climate.set_hvac_mode
                    data: { entity_id: climate.huiskamer, hvac_mode: "auto" }
        - button:
            id: huiskamer_btn_heat
            align: CENTER
            x: 0
            y: 200
            width: 100
            height: 50
            bg_color: 0x292929
            widgets:
              - label:
                  align: CENTER
                  text: "\uEF55"
                  text_font: material_icons_32
            on_click:
              then:
                - homeassistant.action:
                    action: climate.set_hvac_mode
                    data: { entity_id: climate.huiskamer, hvac_mode: "heat" }
        - button:
            id: huiskamer_btn_off
            align: CENTER
            x: 120
            y: 200
            width: 100
            height: 50
            bg_color: 0x292929
            widgets:
              - label:
                  align: CENTER
                  text: "\uE8AC"
                  text_font: material_icons_32
            on_click:
              then:
                - homeassistant.action:
                    action: climate.set_hvac_mode
                    data: { entity_id: climate.huiskamer, hvac_mode: "off" }
        - button:
            align: CENTER
            x: -190
            y: -190
            width: 54
            height: 54
            bg_color: 0x000000
            text_font: montserrat_32
            widgets:
              - label: { align: CENTER, text: "\uF053" }
            on_click:
              then:
                - lvgl.page.show: { id: dhw_page, animation: MOVE_RIGHT, time: 20ms }
        - button:
            align: CENTER
            x: 190
            y: -190
            width: 54
            height: 54
            bg_color: 0x000000
            text_font: montserrat_32
            widgets:
              - label: { align: CENTER, text: "\uF054" }
            on_click:
              then:
