esphome:
  name: diyless-thermostat-3
  friendly_name: DIYLESS Thermostat 3
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ: "240"
  flash_size: 8MB
  
psram:
  mode: octal
  speed: 80MHz  

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_secret

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - lvgl.label.update:
        id: ip_label
        text:
          format: "\uF1EB %s"
          args: [ '([]() -> const char* { static char b[16]; id(wifi_id).wifi_sta_ip_addresses()[0].str_to(b); return b; }())' ]
  on_disconnect:
    - lvgl.label.update:
        id: ip_label
        text: "\uF1EB disconnected"
  ap:
    ssid: "DIYLESS-Thermostat-3"
    password: ""
    
captive_portal:
web_server:

output:
  - platform: ledc
    id: backlight_output
    pin:
      number: GPIO46

light:
  - platform: monochromatic
    id: backlight
    name: Thermostat Backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

number:
  - platform: template
    name: Display timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 30
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box

i2c:
  sda: GPIO17
  scl: GPIO18
  scan: true

spi:
  clk_pin:
    number: GPIO12
    allow_other_uses: false
  mosi_pin:
    number: GPIO11
    allow_other_uses: false

display:
  - id: diyless_display
    platform: st7701s
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    dimensions:
      width: 480
      height: 480
    invert_colors: true
    cs_pin: GPIO1
    reset_pin: GPIO43
    de_pin: GPIO45
    hsync_pin: GPIO5
    vsync_pin: GPIO4
    pclk_pin: GPIO21
    pclk_frequency: 10MHz
    pclk_inverted: false
    hsync_pulse_width: 14
    hsync_back_porch:  14
    hsync_front_porch: 14
    vsync_pulse_width:  10
    vsync_back_porch:  14
    vsync_front_porch: 14
    data_pins:
      red:
        - 39
        - 40
        - 41
        - 42
        - 02
      green:
        - 00
        - 09
        - 14
        - 47
        - 48
        - 03
      blue:
        - 06
        - 07
        - 15
        - 16
        - 08

touchscreen:
  - id: diyless_touchscreen
    platform: gt911
    interrupt_pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
    update_interval: 100ms
    on_release:
      - light.turn_on:
          id: backlight
          brightness: 100%

font:
  - file:
      type: gfonts
      family: Roboto
    id: font_roboto_72
    size: 72
    bpp: 8
  - file:
      type: gfonts
      family: Montserrat
    id: montserrat_20
    size: 20
    bpp: 8
  - file:
      type: gfonts
      family: Montserrat
    id: montserrat_32
    size: 32
    bpp: 8
  - file:
      type: gfonts
      family: Montserrat
    id: montserrat_48
    size: 48
    bpp: 8

script:
  - id: set_huiskamer
    mode: restart
    parameters:
      temp: float
    then:
      - delay: 500ms
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.huiskamer
          data_template:
            temperature: '{{ target }}'
          variables:
            target: 'return temp;'
  - id: set_keuken
    mode: restart
    parameters:
      temp: float
    then:
      - delay: 500ms
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.keuken
          data_template:
            temperature: '{{ target }}'
          variables:
            target: 'return temp;'
  - id: set_hal
    mode: restart
    parameters:
      temp: float
    then:
      - delay: 500ms
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.hal
          data_template:
            temperature: '{{ target }}'
          variables:
            target: 'return temp;'
  - id: set_slaapkamer
    mode: restart
    parameters:
      temp: float
    then:
      - delay: 500ms
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.slaapkamer
          data_template:
            temperature: '{{ target }}'
          variables:
            target: 'return temp;'
  - id: set_dhw
    mode: restart
    parameters:
      temp: float
    then:
      - delay: 500ms
      - homeassistant.service:
          service: water_heater.set_temperature
          data:
            entity_id: water_heater.hot_water
          data_template:
            temperature: '{{ target }}'
          variables:
            target: 'return temp;'

binary_sensor:
  - platform: homeassistant
    id: boiler_flame
    entity_id: binary_sensor.slave_flame_on_boiler_otgw
    on_state:
      then:
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: flame_icon
                  text_color: 0xFF6F22
            else:
              - lvgl.label.update:
                  id: flame_icon
                  text_color: 0x2095F6

text_sensor:
  - platform: homeassistant
    id: huiskamer_action
    entity_id: climate.huiskamer
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: huiskamer_action_label
          text:
            format: "%s"
            args: [ 'x.c_str()' ]
  - platform: homeassistant
    id: keuken_action
    entity_id: climate.keuken
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: keuken_action_label
          text:
            format: "%s"
            args: [ 'x.c_str()' ]
  - platform: homeassistant
    id: hal_action
    entity_id: climate.hal
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: hal_action_label
          text:
            format: "%s"
            args: [ 'x.c_str()' ]
  - platform: homeassistant
    id: slaapkamer_action
    entity_id: climate.slaapkamer
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: slaapkamer_action_label
          text:
            format: "%s"
            args: [ 'x.c_str()' ]
  - platform: homeassistant
    id: dhw_action
    entity_id: water_heater.hot_water
    attribute: state
    on_value:
      - lvgl.label.update:
          id: dhw_action_label
          text:
            format: "%s"
            args: [ 'x.c_str()' ]

