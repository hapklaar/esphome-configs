.lvgl_styles:
  container: &style_container
    width: 202
    height: 146
    x: 10
    bg_color: 0xFFFFFF
    radius: 12
  main_btn: &style_main_btn
    checkable: true
    width: 182
    height: 50
    align: TOP_MID
    y: 10
    bg_color: 0x4A4A4A
    checked:
      bg_color: 0xFF6600
    disabled:
      bg_color: 0x888888
      bg_opa: 50%
  main_label: &style_main_label
    align: CENTER
    text_font: montserrat_20
    text_color: 0xFFFFFF
  slider: &style_slider
    min_value: 0
    max_value: 255
    width: 182
    height: 10
    align: TOP_MID
    y: 77
    bg_color: 0xEEEEEE
    radius: 7
    disabled:
      bg_color: 0xCCCCCC
  minus_btn: &style_minus_btn
    width: 40
    height: 35
    x: 10
    y: 108
    bg_color: 0xDEDEDE
    radius: 6
    disabled:
      bg_color: 0xEEEEEE
  plus_btn: &style_plus_btn
    width: 40
    height: 35
    x: 152
    y: 108
    bg_color: 0xDEDEDE
    radius: 6
    disabled:
      bg_color: 0xEEEEEE
  side_label: &style_side_label
    align: CENTER
    text_font: montserrat_20
    text_color: 0x2E2D2D
  pct_btn: &style_pct_btn
    width: 80
    height: 35
    align: TOP_MID
    y: 108
    bg_color: 0xDEDEDE
    disabled:
      bg_color: 0xEEEEEE
  pct_label: &style_pct_label
    align: CENTER
    text_font: montserrat_18
    text_color: 0x2E2D2D

esphome:
  name: t-display-s3-pro-lights
  friendly_name: "T-Display S3 Pro Lights"
  on_boot:
    priority: -100
    then:
      - script.execute: backlight_wake

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret api_secret

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  min_auth_mode: WPA2

psram:
  mode: octal
  speed: 80MHz

logger:

font:
  - file: "gfonts://Montserrat"
    id: montserrat_28
    size: 28
  - file: "gfonts://Montserrat"
    id: montserrat_20
    size: 20
  - file: "gfonts://Montserrat"
    id: montserrat_18
    size: 18
  - file: "gfonts://Montserrat"
    id: montserrat_14
    size: 14

output:
  - platform: ledc
    pin: 48
    id: backlight_pwm
    frequency: 5000 Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    id: display_backlight
    gamma_correct: 2.2
    name: "Display Backlight"
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

spi:
  clk_pin: 18
  mosi_pin: 17

i2c:
  - scl: 6
    sda: 5
    scan: true
    id: i2c_onboard
    frequency: 400kHz

display:
  - platform: mipi_spi
    model: t-display-s3-pro
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst226
    interrupt_pin: 21
    reset_pin: 13
    on_touch:
      - script.execute: backlight_wake

globals:
  - id: slider_active_lr
    type: bool
    initial_value: "false"
  - id: slider_active_hw
    type: bool
    initial_value: "false"
  - id: slider_active_lr_table
    type: bool
    initial_value: "false"

script:
  # -------- BACKLIGHT CONTROL --------
  - id: backlight_idle_timer
    mode: restart
    then:
      - delay: 30s
      - light.turn_on:
          id: display_backlight
          brightness: 30%
          transition_length: 2s
      - lvgl.widget.show: wake_overlay
      # lvgl.pause and the 120s delay have been removed. 
      # The screen will now continuously update while dimmed.

  - id: backlight_wake
    mode: restart
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 90%
          transition_length: 0.1s
      - delay: 300ms
      - lvgl.widget.hide: wake_overlay
      - script.execute: backlight_idle_timer

  # -------- LIGHT CONTROL DEBOUNCING --------
  - id: debounce_lr
    mode: restart
    parameters:
      brightness_val: int
    then:
      - delay: 100ms
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: light.yee_group
            brightness: !lambda "return brightness_val;"
            transition: "0"

  - id: end_slider_lr
    mode: restart
    then:
      - delay: 800ms
      - lambda: "id(slider_active_lr) = false;"

  - id: debounce_lr_table
    mode: restart
    parameters:
      brightness_val: int
    then:
      - delay: 100ms
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: light.front_dimmer_light
            brightness: !lambda "return brightness_val;"
            transition: "0"

  - id: end_slider_lr_table
    mode: restart
    then:
      - delay: 800ms
      - lambda: "id(slider_active_lr_table) = false;"

  - id: debounce_hw
    mode: restart
    parameters:
      brightness_val: int
    then:
      - delay: 100ms
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: light.ledvance_dimming_lightbulb
            brightness: !lambda "return brightness_val;"
            transition: "0"

  - id: end_slider_hw
    mode: restart
    then:
      - delay: 800ms
      - lambda: "id(slider_active_hw) = false;"

text_sensor:
  - platform: homeassistant
    id: lr_light_availability
    entity_id: light.yee_group
    on_value:
      - if:
          condition:
            lambda: 'return x == "unavailable" || x == "unknown";'
          then:
            - lambda: |-
                lv_obj_add_state(id(lr_btn), LV_STATE_DISABLED);
                lv_obj_add_state(id(lr_slider), LV_STATE_DISABLED);
                lv_obj_add_state(id(lr_minus), LV_STATE_DISABLED);
                lv_obj_add_state(id(lr_plus), LV_STATE_DISABLED);
                lv_obj_add_state(id(lr_pct_btn), LV_STATE_DISABLED);
                lv_label_set_text(id(lr_btn_label), "Offline");
                lv_label_set_text(id(lr_pct), "-");
          else:
            - lambda: |-
                lv_obj_clear_state(id(lr_btn), LV_STATE_DISABLED);
                lv_obj_clear_state(id(lr_slider), LV_STATE_DISABLED);
                lv_obj_clear_state(id(lr_minus), LV_STATE_DISABLED);
                lv_obj_clear_state(id(lr_plus), LV_STATE_DISABLED);
                lv_obj_clear_state(id(lr_pct_btn), LV_STATE_DISABLED);
                lv_label_set_text(id(lr_btn_label), "LR Lights");

  - platform: homeassistant
    id: lr_table_light_availability
    entity_id: light.front_dimmer_light
    on_value:
      - if:
          condition:
            lambda: 'return x == "unavailable" || x == "unknown";'
          then:
            - lambda: |-
                lv_obj_add_state(id(lr_table_btn), LV_STATE_DISABLED);
                lv_obj_add_state(id(lr_table_slider), LV_STATE_DISABLED);
                lv_obj_add_state(id(lr_table_minus), LV_STATE_DISABLED);
                lv_obj_add_state(id(lr_table_plus), LV_STATE_DISABLED);
                lv_obj_add_state(id(lr_table_pct_btn), LV_STATE_DISABLED);
                lv_label_set_text(id(lr_table_btn_label), "Offline");
                lv_label_set_text(id(lr_table_pct), "-");
          else:
            - lambda: |-
                lv_obj_clear_state(id(lr_table_btn), LV_STATE_DISABLED);
                lv_obj_clear_state(id(lr_table_slider), LV_STATE_DISABLED);
                lv_obj_clear_state(id(lr_table_minus), LV_STATE_DISABLED);
                lv_obj_clear_state(id(lr_table_plus), LV_STATE_DISABLED);
                lv_obj_clear_state(id(lr_table_pct_btn), LV_STATE_DISABLED);
                lv_label_set_text(id(lr_table_btn_label), "Table front");

  - platform: homeassistant
    id: hw_light_availability
    entity_id: light.ledvance_dimming_lightbulb
    on_value:
      - if:
          condition:
            lambda: 'return x == "unavailable" || x == "unknown";'
          then:
            - lambda: |-
                lv_obj_add_state(id(hw_btn), LV_STATE_DISABLED);
                lv_obj_add_state(id(hw_slider), LV_STATE_DISABLED);
                lv_obj_add_state(id(hw_minus), LV_STATE_DISABLED);
                lv_obj_add_state(id(hw_plus), LV_STATE_DISABLED);
                lv_obj_add_state(id(hw_pct_btn), LV_STATE_DISABLED);
                lv_label_set_text(id(hw_btn_label), "Offline");
                lv_label_set_text(id(hw_pct), "-");
          else:
            - lambda: |-
                lv_obj_clear_state(id(hw_btn), LV_STATE_DISABLED);
                lv_obj_clear_state(id(hw_slider), LV_STATE_DISABLED);
                lv_obj_clear_state(id(hw_minus), LV_STATE_DISABLED);
                lv_obj_clear_state(id(hw_plus), LV_STATE_DISABLED);
                lv_obj_clear_state(id(hw_pct_btn), LV_STATE_DISABLED);
                lv_label_set_text(id(hw_btn_label), "Hallway");

binary_sensor:
  - platform: status
    id: api_status
    on_state:
      - lvgl.widget.update:
          id: status_indicator
          bg_color: !lambda "return x ? lv_color_hex(0x00FF00) : lv_color_hex(0xF44336);"

  - platform: homeassistant
    id: lr_light_state
    entity_id: light.yee_group
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: lr_btn
          state:
            checked: !lambda "return x;"
      - if:
          condition:
            lambda: "return !x && !id(slider_active_lr);"
          then:
            - lvgl.slider.update:
                id: lr_slider
                value: 0
            - lvgl.label.update:
                id: lr_pct
                text: "0%"

  - platform: homeassistant
    id: hw_light_state
    entity_id: light.ledvance_dimming_lightbulb
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: hw_btn
          state:
            checked: !lambda "return x;"
      - if:
          condition:
            lambda: "return !x && !id(slider_active_hw);"
          then:
            - lvgl.slider.update:
                id: hw_slider
                value: 0
            - lvgl.label.update:
                id: hw_pct
                text: "0%"

  - platform: homeassistant
    id: lr_table_light_state
    entity_id: light.front_dimmer_light
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: lr_table_btn
          state:
            checked: !lambda "return x;"
      - if:
          condition:
            lambda: "return !x && !id(slider_active_lr_table);"
          then:
            - lvgl.slider.update:
                id: lr_table_slider
                value: 0
            - lvgl.label.update:
                id: lr_table_pct
                text: "0%"

sensor:
  - platform: homeassistant
    id: lr_brightness
    entity_id: light.yee_group
    attribute: brightness
    on_value:
      - if:
          condition:
            lambda: "return !isnan(x) && !id(slider_active_lr);"
          then:
            - lvgl.slider.update:
                id: lr_slider
                value: !lambda "return (int)roundf(x);"
            - lvgl.label.update:
                id: lr_pct
                text: !lambda 'return str_sprintf("%d%%", (int)roundf((x / 255.0f) * 100.0f));'

  - platform: homeassistant
    id: hw_brightness
    entity_id: light.ledvance_dimming_lightbulb
    attribute: brightness
    on_value:
      - if:
          condition:
            lambda: "return !isnan(x) && !id(slider_active_hw);"
          then:
            - lvgl.slider.update:
                id: hw_slider
                value: !lambda "return (int)roundf(x);"
            - lvgl.label.update:
                id: hw_pct
                text: !lambda 'return str_sprintf("%d%%", (int)roundf((x / 255.0f) * 100.0f));'

  - platform: homeassistant
    id: lr_table_brightness
    entity_id: light.front_dimmer_light
    attribute: brightness
    on_value:
      - if:
          condition:
            lambda: "return !isnan(x) && !id(slider_active_lr_table);"
          then:
            - lvgl.slider.update:
                id: lr_table_slider
                value: !lambda "return (int)roundf(x);"
            - lvgl.label.update:
                id: lr_table_pct
                text: !lambda 'return str_sprintf("%d%%", (int)roundf((x / 255.0f) * 100.0f));'

lvgl:
  buffer_size: 25%
  pages:
    - id: lights_page
      bg_color: 0xF2F2EE
      widgets:
        # ==========================================
        # --- STATUS INDICATOR ---
        # ==========================================
        - obj:
            id: status_indicator
            width: 16
            height: 16
            align: TOP_RIGHT
            x: -4
            y: 4
            bg_color: 0xF44336
            bg_opa: COVER
            radius: 8
            border_width: 0

        # ==========================================
        # --- LIVING ROOM ---
        # ==========================================
        - container:
            <<: *style_container
            y: 10
            widgets:
              - button:
                  <<: *style_main_btn
                  id: lr_btn
                  on_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.yee_group
                  widgets:
                    - label:
                        <<: *style_main_label
                        id: lr_btn_label
                        text: "LR Lights"

              - slider:
                  <<: *style_slider
                  id: lr_slider
                  on_press:
                    - script.stop: end_slider_lr
                    - lambda: "id(slider_active_lr) = true;"
                  on_value:
                    - script.execute:
                        id: debounce_lr
                        brightness_val: !lambda "return (int)x;"
                    - lvgl.label.update:
                        id: lr_pct
                        text: !lambda 'return str_sprintf("%d%%", (int)roundf((x / 255.0f) * 100.0f));'
                  on_release:
                    - script.execute: end_slider_lr

              - button:
                  <<: *style_minus_btn
                  id: lr_minus
                  on_click:
                    - script.stop: end_slider_lr
                    - lambda: "id(slider_active_lr) = true;"
                    - lvgl.slider.update:
                        id: lr_slider
                        value: !lambda |-
                          int next = lv_slider_get_value(id(lr_slider)) - 26;
                          return next < 0 ? 0 : next;
                    - script.execute:
                        id: debounce_lr
                        brightness_val: !lambda "return lv_slider_get_value(id(lr_slider));"
                    - lvgl.label.update:
                        id: lr_pct
                        text: !lambda 'return str_sprintf("%d%%", (int)roundf((lv_slider_get_value(id(lr_slider)) / 255.0f) * 100.0f));'
                    - script.execute: end_slider_lr
                  widgets:
                    - label:
                        <<: *style_side_label
                        text: "-"

              - button:
                  <<: *style_plus_btn
                  id: lr_plus
                  on_click:
                    - script.stop: end_slider_lr
                    - lambda: "id(slider_active_lr) = true;"
                    - lvgl.slider.update:
                        id: lr_slider
                        value: !lambda |-
                          int next = lv_slider_get_value(id(lr_slider)) + 26;
                          return next > 255 ? 255 : next;
                    - script.execute:
                        id: debounce_lr
                        brightness_val: !lambda "return lv_slider_get_value(id(lr_slider));"
                    - lvgl.label.update:
                        id: lr_pct
                        text: !lambda 'return str_sprintf("%d%%", (int)roundf((lv_slider_get_value(id(lr_slider)) / 255.0f) * 100.0f));'
                    - script.execute: end_slider_lr
                  widgets:
                    - label:
                        <<: *style_side_label
                        text: "+"

              - button:
                  <<: *style_pct_btn
                  id: lr_pct_btn
                  on_click:
                    - script.stop: end_slider_lr
                    - lambda: "id(slider_active_lr) = true;"
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: light.yee_group
                          brightness: "255"
                          transition: "0"
                    - lvgl.slider.update:
                        id: lr_slider
                        value: 255
                    - lvgl.label.update:
                        id: lr_pct
                        text: "100%"
                    - script.execute: end_slider_lr
                  widgets:
                    - label:
                        <<: *style_pct_label
                        id: lr_pct
                        text: "0%"

        # ==========================================
        # --- COFFEE TABLE ---
        # ==========================================
        - container:
            <<: *style_container
            y: 166
            widgets:
              - button:
                  <<: *style_main_btn
                  id: lr_table_btn
                  on_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.front_dimmer_light
                  widgets:
                    - label:
                        <<: *style_main_label
                        id: lr_table_btn_label
                        text: "Table front"

              - slider:
                  <<: *style_slider
                  id: lr_table_slider
                  on_press:
                    - script.stop: end_slider_lr_table
                    - lambda: "id(slider_active_lr_table) = true;"
                  on_value:
                    - script.execute:
                        id: debounce_lr_table
                        brightness_val: !lambda "return (int)x;"
                    - lvgl.label.update:
                        id: lr_table_pct
                        text: !lambda 'return str_sprintf("%d%%", (int)roundf((x / 255.0f) * 100.0f));'
                  on_release:
                    - script.execute: end_slider_lr_table

              - button:
                  <<: *style_minus_btn
                  id: lr_table_minus
                  on_click:
                    - script.stop: end_slider_lr_table
                    - lambda: "id(slider_active_lr_table) = true;"
                    - lvgl.slider.update:
                        id: lr_table_slider
                        value: !lambda |-
                          int next = lv_slider_get_value(id(lr_table_slider)) - 26;
                          return next < 0 ? 0 : next;
                    - script.execute:
                        id: debounce_lr_table
                        brightness_val: !lambda "return lv_slider_get_value(id(lr_table_slider));"
                    - lvgl.label.update:
                        id: lr_table_pct
                        text: !lambda 'return str_sprintf("%d%%", (int)roundf((lv_slider_get_value(id(lr_table_slider)) / 255.0f) * 100.0f));'
                    - script.execute: end_slider_lr_table
                  widgets:
                    - label:
                        <<: *style_side_label
                        text: "-"

              - button:
                  <<: *style_plus_btn
                  id: lr_table_plus
                  on_click:
                    - script.stop: end_slider_lr_table
                    - lambda: "id(slider_active_lr_table) = true;"
                    - lvgl.slider.update:
                        id: lr_table_slider
                        value: !lambda |-
                          int next = lv_slider_get_value(id(lr_table_slider)) + 26;
                          return next > 255 ? 255 : next;
                    - script.execute:
                        id: debounce_lr_table
                        brightness_val: !lambda "return lv_slider_get_value(id(lr_table_slider));"
                    - lvgl.label.update:
                        id: lr_table_pct
                        text: !lambda 'return str_sprintf("%d%%", (int)roundf((lv_slider_get_value(id(lr_table_slider)) / 255.0f) * 100.0f));'
                    - script.execute: end_slider_lr_table
                  widgets:
                    - label:
                        <<: *style_side_label
                        text: "+"

              - button:
                  <<: *style_pct_btn
                  id: lr_table_pct_btn
                  on_click:
                    - script.stop: end_slider_lr_table
                    - lambda: "id(slider_active_lr_table) = true;"
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: light.front_dimmer_light
                          brightness: "255"
                          transition: "0"
                    - lvgl.slider.update:
                        id: lr_table_slider
                        value: 255
                    - lvgl.label.update:
                        id: lr_table_pct
                        text: "100%"
                    - script.execute: end_slider_lr_table
                  widgets:
                    - label:
                        <<: *style_pct_label
                        id: lr_table_pct
                        text: "0%"

        # ==========================================
        # --- HALLWAY ---
        # ==========================================
        - container:
            <<: *style_container
            y: 322
            widgets:
              - button:
                  <<: *style_main_btn
                  id: hw_btn
                  on_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.ledvance_dimming_lightbulb
                  widgets:
                    - label:
                        <<: *style_main_label
                        id: hw_btn_label
                        text: "Hallway"

              - slider:
                  <<: *style_slider
                  id: hw_slider
                  on_press:
                    - script.stop: end_slider_hw
                    - lambda: "id(slider_active_hw) = true;"
                  on_value:
