                    - script.execute:
                        id: debounce_hw
                        brightness_val: !lambda "return lv_slider_get_value(id(hw_slider));"
                    - lvgl.label.update:
                        id: hw_pct
                        text: !lambda 'return str_sprintf("%d%%", (int)roundf((lv_slider_get_value(id(hw_slider)) / 255.0f) * 100.0f));'
                    - script.execute: end_slider_hw
                  widgets:
                    - label:
                        <<: *style_side_label
                        text: "-"

              - button:
                  <<: *style_plus_btn
                  id: hw_plus
                  on_click:
                    - script.stop: end_slider_hw
                    - lambda: "id(slider_active_hw) = true;"
                    - lvgl.slider.update:
                        id: hw_slider
                        value: !lambda |-
                          int next = lv_slider_get_value(id(hw_slider)) + 26;
                          return next > 255 ? 255 : next;
                    - script.execute:
                        id: debounce_hw
                        brightness_val: !lambda "return lv_slider_get_value(id(hw_slider));"
                    - lvgl.label.update:
                        id: hw_pct
                        text: !lambda 'return str_sprintf("%d%%", (int)roundf((lv_slider_get_value(id(hw_slider)) / 255.0f) * 100.0f));'
                    - script.execute: end_slider_hw
                  widgets:
                    - label:
                        <<: *style_side_label
                        text: "+"

              - button:
                  <<: *style_pct_btn
                  id: hw_pct_btn
                  on_click:
                    - script.stop: end_slider_hw
                    - lambda: "id(slider_active_hw) = true;"
                    - homeassistant.action:
