                        id: debounce_hw
                        brightness_val: !lambda "return (int)x;"
                    - lvgl.label.update:
                        id: hw_pct
                        text: !lambda 'return str_sprintf("%d%%", (int)roundf((x / 255.0f) * 100.0f));'
                  on_release:
                    - script.execute: end_slider_hw

              - button:
                  <<: *style_minus_btn
                  id: hw_minus
                  on_click:
                    - script.stop: end_slider_hw
                    - lambda: "id(slider_active_hw) = true;"
                    - lvgl.slider.update:
